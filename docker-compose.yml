version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-intelligence-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:///./data/store_intelligence.db"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
      - ./events_output:/app/events_output
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - intelligence-network

networks:
  intelligence-network:
    driver: bridge
